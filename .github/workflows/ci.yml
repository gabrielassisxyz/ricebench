name: ci

on:
  push:
    branches: [main]
  pull_request:
    # `edited` is load-bearing: the default types cover pushes, not text edits, so without it
    # the prose check on a pull request title and body only reruns on the next push and reads
    # that event's payload. A body fixed afterwards would still fail, and a body edited to add
    # a tell would pass.
    types: [opened, synchronize, reopened, edited]

jobs:
  ci:
    # Correcting a title should not trigger a full build.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the Go check tools
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: bin/ci

  gitleaks:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI rather than gitleaks-action: same binary and same rules as the
      # pre-commit hook, deterministic pass or fail, and no write token to grant.
      - name: Secret scan (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact

  pr-text:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A pull request title and body are published text that never touch the git tree, so
      # nothing else ever reads them.
      - name: Pull request text has no slop
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$TITLE" "$BODY" | bin/slop-guard --stdin "PR text"
